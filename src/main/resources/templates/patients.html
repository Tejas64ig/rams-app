<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-3">
    <h2>Patient Management</h2>
    <form th:action="@{/patients}" method="post" class="row g-2 mb-4">
        <div class="col-md-4"><input type="text" class="form-control" name="name" placeholder="Patient Name" required></div>
        <div class="col-md-4"><input type="text" class="form-control" name="medicalHistory" placeholder="Medical History (optional)"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add Patient</button></div>
    </form>
    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Name</th><th>Medical History</th><th>Last Treatment</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="p : ${patients}">
            <td th:text="${p.patientId}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.medicalHistory}"></td>
            <td th:text="${p.lastRequestedTreatment}"></td>
            <td>
                <a th:href="@{'/patients/' + ${p.patientId} + '/edit'}" class="btn btn-sm btn-outline-primary">Edit</a>
                <form th:action="@{'/patients/' + ${p.patientId} + '/delete'}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('Delete this patient?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(patients)}" class="text-muted">No patients registered yet. Add one above or use <a th:href="@{/setup}">Setup</a>.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
