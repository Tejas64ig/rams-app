<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Treatments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-3">
    <h2>Treatment History</h2>
    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Description</th><th>Doctor</th><th>Patient</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="t : ${treatments}">
            <td th:text="${t.treatmentId}"></td>
            <td th:text="${t.description}"></td>
            <td th:text="${t.doctor?.name}"></td>
            <td th:text="${t.patient?.name}"></td>
            <td>
                <span th:if="${t.applied}" class="badge bg-success">Applied</span>
                <span th:unless="${t.applied}" class="badge bg-warning">Pending</span>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(treatments)}" class="text-muted">No treatments yet.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
