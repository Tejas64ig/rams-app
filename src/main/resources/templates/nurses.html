<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Nurses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-3">
    <h2>Nurse Management</h2>
    <form th:action="@{/nurses}" method="post" class="row g-2 mb-4">
        <div class="col-md-4"><input type="text" class="form-control" name="name" placeholder="Nurse Name" required></div>
        <div class="col-md-3">
            <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" name="onShift" value="true" checked>
                <label class="form-check-label">On Shift</label>
            </div>
        </div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add Nurse</button></div>
    </form>
    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Name</th><th>Shift Status</th><th>Assigned Patient</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="n : ${nurses}">
            <td th:text="${n.staffId}"></td>
            <td th:text="${n.name}"></td>
            <td>
                <span th:if="${n.onShift}" class="badge bg-success">On Shift</span>
                <span th:unless="${n.onShift}" class="badge bg-secondary">Off Shift</span>
            </td>
            <td th:text="${n.patient?.name ?: '-'}"></td>
            <td>
                <form th:action="@{'/nurses/' + ${n.staffId} + '/delete'}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('Delete?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(nurses)}" class="text-muted">No nurses registered yet.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
