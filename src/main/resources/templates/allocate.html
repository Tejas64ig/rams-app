<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Allocate Treatment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-4" style="max-width: 600px;">
    <h2>Request Treatment &amp; Allocate Resource</h2>
    <p><a th:href="@{/setup}">&larr; Back to setup</a></p>

    <!-- Shows the outcome of the alt/else branches from the sequence diagram -->
    <div th:if="${message}" class="alert" th:classappend="${success} ? 'alert-success' : 'alert-danger'">
        <span th:text="${message}"></span>
    </div>

    <form th:action="@{/allocate}" method="post">
        <div class="mb-3">
            <label class="form-label">Patient</label>
            <select class="form-select" name="patientId" required>
                <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Doctor</label>
            <select class="form-select" name="doctorId" required>
                <option th:each="d : ${doctors}" th:value="${d.staffId}"
                        th:text="${d.name} + ' (' + ${d.specialization} + ')'"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Treatment description</label>
            <input class="form-control" name="treatmentDescription" placeholder="e.g. Knee surgery" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Required resource type</label>
            <input class="form-control" name="resourceType" placeholder="e.g. ICU Bed" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Request Treatment</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
