<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Resources</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-3">
    <h2>Resource Management</h2>
    <form th:action="@{/resources}" method="post" class="row g-2 mb-4">
        <div class="col-md-4"><input type="text" class="form-control" name="type" placeholder="Resource type e.g. ICU Bed" required></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add Resource</button></div>
    </form>
    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="r : ${resources}">
            <td th:text="${r.resourceId}"></td>
            <td th:text="${r.type}"></td>
            <td>
                <span th:text="${r.status}" class="badge"
                      th:classappend="${r.status.name() == 'AVAILABLE'} ? 'bg-success' : (${r.status.name() == 'ALLOCATED'} ? 'bg-danger' : 'bg-warning')"></span>
            </td>
            <td>
                <form th:if="${r.status.name() == 'ALLOCATED'}" th:action="@{'/resources/' + ${r.resourceId} + '/release'}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-success" type="submit">Release</button>
                </form>
                <a th:href="@{'/resources/' + ${r.resourceId} + '/edit'}" class="btn btn-sm btn-outline-primary">Edit</a>
                <form th:action="@{'/resources/' + ${r.resourceId} + '/delete'}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('Delete?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(resources)}" class="text-muted">No resources registered yet.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
