<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-3">
    <h2>Appointment History</h2>
    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="a : ${appointments}">
            <td th:text="${a.appointmentId}"></td>
            <td th:text="${a.patient?.name}"></td>
            <td th:text="${a.doctor?.name}"></td>
            <td th:text="${#temporals.format(a.date, 'dd MMM yyyy HH:mm')}"></td>
            <td>
                <span th:if="${a.confirmed}" class="badge bg-success">Confirmed</span>
                <span th:unless="${a.confirmed}" class="badge bg-warning">Pending</span>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(appointments)}" class="text-muted">No appointments yet. <a th:href="@{/allocate}">Allocate a treatment</a> to create one.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
