<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Edit Resource</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-3" style="max-width:600px">
    <h2>Edit Resource</h2>
    <form th:action="@{'/resources/' + ${resource.resourceId} + '/edit'}" method="post">
        <div class="mb-3">
            <label class="form-label">Type</label>
            <input type="text" class="form-control" name="type" th:value="${resource.type}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="status">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == resource.status}"></option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Save Changes</button>
        <a th:href="@{/resources}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
