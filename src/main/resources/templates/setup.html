<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Setup Test Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-4">
    <h2>Setup Test Data</h2>
    <p><a th:href="@{/allocate}">Go to Allocate Treatment &rarr;</a></p>

    <div class="row">
        <div class="col-md-4">
            <h5>Add Patient</h5>
            <form th:action="@{/setup/patient}" method="post" class="mb-4">
                <input class="form-control mb-2" name="name" placeholder="Name" required>
                <input class="form-control mb-2" name="medicalHistory" placeholder="Medical history (optional)">
                <button class="btn btn-primary w-100" type="submit">Add Patient</button>
            </form>
            <ul class="list-group">
                <li class="list-group-item" th:each="p : ${patients}"
                    th:text="${p.patientId} + ' - ' + ${p.name}"></li>
            </ul>
        </div>

        <div class="col-md-4">
            <h5>Add Doctor</h5>
            <form th:action="@{/setup/doctor}" method="post" class="mb-4">
                <input class="form-control mb-2" name="name" placeholder="Name" required>
                <input class="form-control mb-2" name="specialization" placeholder="Specialization" required>
                <button class="btn btn-primary w-100" type="submit">Add Doctor</button>
            </form>
            <ul class="list-group">
                <li class="list-group-item" th:each="d : ${doctors}"
                    th:text="${d.staffId} + ' - ' + ${d.name} + ' (' + ${d.specialization} + ')'"></li>
            </ul>
        </div>

        <div class="col-md-4">
            <h5>Add Resource</h5>
            <form th:action="@{/setup/resource}" method="post" class="mb-4">
                <input class="form-control mb-2" name="type" placeholder="Type e.g. ICU Bed" required>
                <button class="btn btn-primary w-100" type="submit">Add Resource</button>
            </form>
            <ul class="list-group">
                <li class="list-group-item" th:each="r : ${resources}"
                    th:text="${r.resourceId} + ' - ' + ${r.type} + ' [' + ${r.status} + ']'"></li>
            </ul>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
