<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAMS - Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-3">
    <h2>Doctor Management</h2>
    <form th:action="@{/doctors}" method="post" class="row g-2 mb-4">
        <div class="col-md-4"><input type="text" class="form-control" name="name" placeholder="Doctor Name" required></div>
        <div class="col-md-3"><input type="text" class="form-control" name="specialization" placeholder="Specialization" required></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add Doctor</button></div>
    </form>
    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="d : ${doctors}">
            <td th:text="${d.staffId}"></td>
            <td th:text="${d.name}"></td>
            <td th:text="${d.specialization}"></td>
            <td>
                <span th:if="${d.busy}" class="badge bg-danger">Busy</span>
                <span th:unless="${d.busy}" class="badge bg-success">Available</span>
            </td>
            <td>
                <a th:href="@{'/doctors/' + ${d.staffId} + '/edit'}" class="btn btn-sm btn-outline-primary">Edit</a>
                <form th:if="${d.busy}" th:action="@{'/doctors/' + ${d.staffId} + '/free'}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-warning" type="submit">Mark Free</button>
                </form>
                <form th:action="@{'/doctors/' + ${d.staffId} + '/delete'}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('Delete this doctor?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(doctors)}" class="text-muted">No doctors registered yet.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
