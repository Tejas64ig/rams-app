# ---- MySQL 8.0 Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/ramsdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=bro64489

# ---- H2 console disabled (using MySQL now) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# create/update tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- To switch back to H2 in-memory, replace the datasource block with: ----
